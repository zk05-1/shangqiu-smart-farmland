# Render Blueprint - 商丘市农业农村局智能农田管理系统
# 后端 Spring Boot + PostgreSQL 数据库

databases:
  - name: shangqiu-farmland-db
    plan: free
    databaseName: shangqiu_farmland
    user: farmland_user

services:
  - type: web
    name: shangqiu-farmland-backend
    runtime: docker
    rootDir: 框架/server
    plan: free
    dockerfile: Dockerfile
    autoDeploy: true
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: shangqiu-farmland-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: shangqiu-farmland-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: shangqiu-farmland-db
          property: password
      - key: SPRING_DATASOURCE_DRIVER
        value: org.postgresql.Driver
      - key: SPRING_JPA_HIBERNATE_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
